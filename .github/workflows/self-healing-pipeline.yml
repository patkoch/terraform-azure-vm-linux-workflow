name: Self-Healing Terraform Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  detect-and-fix:
    runs-on: ubuntu-latest
    outputs:
      issues_found: ${{ steps.detect.outputs.issues_found }}
      issues_summary: ${{ steps.detect.outputs.issues_summary }}

    steps:
      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Checkout repository (fetch full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3
        with:
          tflint_version: latest

      - name: Set Terraform Environment Variables
        run: |
          echo "TF_VAR_subscription_id=${{ secrets.SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_virtual_machine_admin_password=${{ secrets.VIRTUAL_MACHINE_ADMIN_PASSWORD }}" >> $GITHUB_ENV

      - name: Create Public SSH Key File
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > id_rsa.pub

      - name: Initialize Terraform
        id: init
        run: terraform init
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate -json > validate_output.json 2>&1 || true
        continue-on-error: true

      - name: Run TFLint Analysis
        id: tflint
        run: |
          tflint --init
          tflint --format=json > tflint_output.json 2>&1 || true
        continue-on-error: true

      - name: Terraform Format Check
        id: fmt_check
        run: terraform fmt -check -recursive 2>&1 || echo "FORMATTING_ISSUES=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Detect Issues
        id: detect
        run: |
          issues=""
          has_issues=false
          
          # Check formatting issues
          if [ "$FORMATTING_ISSUES" = "true" ]; then
            issues="${issues}1. Terraform formatting issues detected"$'\n'
            has_issues=true
          fi
          
          # Check validation errors
          if grep -q "error" validate_output.json 2>/dev/null; then
            issues="${issues}2. Terraform validation errors detected"$'\n'
            has_issues=true
          fi
          
          # Check TFLint warnings/errors
          if [ -s tflint_output.json ] && grep -q "error\|warning" tflint_output.json 2>/dev/null; then
            issues="${issues}3. TFLint violations detected"$'\n'
            has_issues=true
          fi
          
          if [ "$has_issues" = true ]; then
            echo "issues_found=true" >> $GITHUB_OUTPUT
            # write a human-readable summary file and expose as output
            printf '%b' "${issues}" > issues_summary.txt
            echo "issues_summary<<EOF" >> $GITHUB_OUTPUT
            echo "${issues}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            # print summary to the job log for easy visibility
            echo "----- Detected Issues Summary -----"
            printf '%b' "${issues}"
            echo "-----------------------------------"
          else
            echo "issues_found=false" >> $GITHUB_OUTPUT
            echo "issues_summary=No issues detected" >> $GITHUB_OUTPUT
          fi

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: |
            validate_output.json
            tflint_output.json
            issues_summary.txt
          retention-days: 7

  code-agent-fix:
    needs: detect-and-fix
    if: needs.detect-and-fix.outputs.issues_found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write
    
    steps:

      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download analysis results
        uses: actions/download-artifact@v4
        with:
          name: analysis-results
          path: .

      - name: Create branch for fixes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          BRANCH_NAME="fix/self-healing-$(date +%s)"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Set Terraform Environment Variables
        run: |
          echo "TF_VAR_subscription_id=${{ secrets.SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_virtual_machine_admin_password=${{ secrets.VIRTUAL_MACHINE_ADMIN_PASSWORD }}" >> $GITHUB_ENV

      - name: Create Public SSH Key File
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > id_rsa.pub

      - name: Auto-fix Terraform Formatting
        id: fmt_fix
        run: |
          terraform fmt -recursive
          if git diff --exit-code >/dev/null 2>&1; then
            echo "formatting_fixed=false" >> $GITHUB_OUTPUT
          else
            echo "formatting_fixed=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Download Analysis Artifacts
        uses: actions/download-artifact@v4
        with:
          name: analysis-results
        continue-on-error: true

      - name: Create GitHub Issue for Copilot Coding Agent
        id: create_issue
        uses: actions/github-script@v7
        env:
          ISSUES_SUMMARY: ${{ needs.detect-and-fix.outputs.issues_summary }}
        with:
          script: |
            const fs = require('fs');

            // Read analysis output files for detailed reporting
            let validateDetails = '';
            let tflintDetails = '';
            try {
              validateDetails = fs.readFileSync('validate_output.json', 'utf8');
            } catch (e) {
              validateDetails = 'No validation output available.';
            }
            try {
              tflintDetails = fs.readFileSync('tflint_output.json', 'utf8');
            } catch (e) {
              tflintDetails = 'No TFLint output available.';
            }

            const issueBody = [
              '## 🔍 Self-Healing Pipeline – Terraform Issues Detected',
              '',
              '**The Self-Healing pipeline detected the following issues:**',
              '',
              process.env.ISSUES_SUMMARY,
              '',
              '### Terraform Validation Output',
              '```json',
              validateDetails,
              '```',
              '',
              '### TFLint Analysis Output',
              '```json',
              tflintDetails,
              '```',
              '',
              '### Workflow Run',
              `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              '',
              '### Required Actions',
              '1. Fix `terraform fmt` formatting issues',
              '2. Resolve `terraform validate` errors',
              '3. Address TFLint violations',
              '',
              '> This issue was automatically created by the Self-Healing Pipeline.',
              '> Please review, fix the issues, and merge the accompanying automated PR.'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Self-Healing: Terraform Configuration Issues Detected',
              body: issueBody,
              labels: ['terraform', 'self-healing']
            });

            core.setOutput('issue_number', issue.data.number);
            console.log(`✅ Created issue #${issue.data.number}: ${issue.data.html_url}`);

      - name: Validate Fixed Code
        id: validate_fix
        run: |
          gh issue create \
            --title "🤖 Self-Healing: Fix Terraform Configuration Issues ($(date -u +%Y-%m-%dT%H-%M-%SZ))" \
            --body "## 🔍 Self-Healing Pipeline – Automated Fix Request

          ### Issues Detected:
          ${{ needs.detect-and-fix.outputs.issues_summary }}

          ### Fix Instructions:
          Please analyze the Terraform configuration files (\`*.tf\`) in this repository and fix all detected issues:

          1. Run \`terraform fmt -recursive\` to correct any formatting violations.
          2. Run \`terraform validate\` to resolve any configuration errors.
          3. Review the TFLint output and apply the recommended fixes.
          4. Ensure variable blocks include \`description\` attributes and sensible \`default\` values where appropriate.
          5. Commit the fixes to branch \`$BRANCH_NAME\` and open a pull request against \`${{ github.ref_name }}\`.

          ---
          *This issue was automatically created by the Self-Healing Pipeline (run ${{ github.run_id }}) on $(date -u '+%Y-%m-%d %H:%M UTC').*" \
            --assignee "@copilot"

      # - name: Validate Fixed Code
      #   id: validate_fix
      #   run: |
      #     terraform init
      #     terraform validate
      #     terraform fmt -check -recursive
      #   continue-on-error: true

      - name: Commit and Push Fixes
        if: steps.fmt_fix.outputs.formatting_fixed == 'true' || success()
        run: |
          # Clean up large files and temporary files
          rm -rf .terraform/
          rm -f id_rsa.pub
          
          # Add only the Terraform configuration files
          git add *.tf terraform.auto.tfvars 2>/dev/null || true
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "🤖 fix: Auto-fix Terraform configuration issues

            - Fixed formatting issues
            - Validated Terraform configuration
            - Applied TFLint recommendations
            
            Triggered by: Self-Healing Pipeline"
            git push origin ${{ env.BRANCH_NAME }}
            echo "CHANGES_PUSHED=true" >> $GITHUB_ENV
          else
            echo "CHANGES_PUSHED=false" >> $GITHUB_ENV
          fi

      - name: Create Pull Request with Fixes
        if: env.CHANGES_PUSHED == 'true'
        uses: actions/github-script@v7
        env:
          ISSUES_SUMMARY: ${{ needs.detect-and-fix.outputs.issues_summary }}
        with:
          github-token: ${{ secrets.SELF_HEALING_TOKEN }}
          script: |
            const { repo, owner } = context.repo;

            const prBody = [
              '## 🤖 Self-Healing Pipeline - Automated Fixes',
              '',
              '### Issues Detected and Fixed:',
              process.env.ISSUES_SUMMARY,
              '',
              '### Changes Made:',
              '- ✅ Fixed Terraform formatting issues',
              '- ✅ Validated Terraform configuration',
              '- ✅ Applied security and best practice recommendations',
              '- ✅ Verified variable definitions and descriptions',
              '',
              '### Next Steps:',
              '1. Review the changes in this PR',
              '2. Merge if everything looks good',
              '3. The automated test will verify all fixes',
              '',
              '---',
              '*This PR was automatically created by the Self-Healing Pipeline.*'
            ].join('\n');

            const pullRequest = await github.rest.pulls.create({
              owner,
              repo,
              title: '🤖 fix: Self-Healing - Automated Terraform Configuration Fixes',
              head: '${{ env.BRANCH_NAME }}',
              base: '${{ github.ref_name }}',
              body: prBody,
              labels: ['🤖 automated', 'terraform', 'self-healing']
            });

            console.log(`✅ Pull Request created: ${pullRequest.data.html_url}`);

            const commentBody = [
              '### 🔍 Detailed Analysis',
              '',
              '**Scan Results:**',
              '- Terraform Validation: ✅',
              '- TFLint Analysis: 🔍',
              '- Formatting Check: ✅',
              '',
              '**Automated Fixes Applied:**',
              '1. Code formatting standardization',
              '2. Configuration validation',
              '3. Best practice alignment',
              '',
              'Please review and approve this PR to merge the fixes.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullRequest.data.number,
              body: commentBody
            });

  test-fixes:
    needs: [detect-and-fix, code-agent-fix]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: terraform-approval
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update branch to latest (ensure merged PR is included)
        run: |
          git fetch origin +refs/heads/${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }} || true
          git checkout ${{ github.ref_name }} || true
          git pull origin ${{ github.ref_name }} || true
        # no 'with' here; this is a shell step that runs git commands

      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Set Terraform Environment Variables
        run: |
          echo "TF_VAR_subscription_id=${{ secrets.SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_virtual_machine_admin_password=${{ secrets.VIRTUAL_MACHINE_ADMIN_PASSWORD }}" >> $GITHUB_ENV

      - name: Create Public SSH Key File
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > id_rsa.pub

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate - Final Check
        id: validate_final
        run: terraform validate
        continue-on-error: true

      - name: Terraform Format Check - Final
        run: terraform fmt -check -recursive

      - name: Report Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const validate = '${{ steps.validate_final.outcome }}';

            let status = '✅';
            let message = 'All tests passed!';

            if (validate === 'failure') {
              status = '❌';
              message = 'Some issues were detected. Please review the logs.';
            }

            console.log(`${status} ${message}`);
            console.log(`\n📊 Test Results:`);
            console.log(`- Validation: ${validate}`);

  summary:
    needs: [detect-and-fix, code-agent-fix, test-fixes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline Summary
        run: |
          echo "## 📊 Self-Healing Pipeline Summary"
          echo ""
          echo "### Issues Detected:"
          echo "${{ needs.detect-and-fix.outputs.issues_summary }}"
          echo ""
          echo "### Actions Taken:"
          echo "- ✅ Analyzed Terraform configuration"
          echo "- ✅ Applied automated fixes"
          echo "- ✅ Validated corrected code"
          echo "- ✅ Created PR with changes (if needed)"
          echo ""
          echo "### Next Steps:"
          echo "1. Review the PR if one was created"
          echo "2. Merge when ready"
          echo "3. Monitor the deployment"
